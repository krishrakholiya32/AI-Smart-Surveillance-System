services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: surveillance
      POSTGRES_PASSWORD: surveillance
      POSTGRES_DB: surveillance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surveillance"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://surveillance:surveillance@db:5432/surveillance
      STORAGE_PATH: /app/storage/alerts
      MODELS_PATH: /app/models
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME must be set in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      ALLOWED_ORIGINS: '["http://localhost", "http://localhost:3000", "http://${SERVER_IP:-localhost}"]'
      # Match thread pools to the CPU quota below — without this, PyTorch/ONNX
      # Runtime detect the host's full core count and oversubscribe threads,
      # causing scheduling thrash that's slower than capping threads correctly.
      OMP_NUM_THREADS: "${BACKEND_CPU_LIMIT:-3}"
      OPENBLAS_NUM_THREADS: "${BACKEND_CPU_LIMIT:-3}"
      MKL_NUM_THREADS: "${BACKEND_CPU_LIMIT:-3}"
      # Detection tuning — sets the *startup* defaults only. The Settings
      # page can change these live afterward without a restart.
      CONF_PERSON: "${CONF_PERSON:-0.50}"
      CONF_WEAPON: "${CONF_WEAPON:-0.45}"
      RUN_THRESH_NORM: "${RUN_THRESH_NORM:-0.18}"
      LOITER_SECS: "${LOITER_SECS:-8}"
      CROWD_LIMIT: "${CROWD_LIMIT:-5}"
    volumes:
      - ./models:/app/models          # .pt / .onnx files live here (writable: ONNX export runs on first boot)
      - alert_storage:/app/storage/alerts
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: '${BACKEND_CPU_LIMIT:-3}'
          memory: ${BACKEND_MEM_LIMIT:-8G}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - alert_storage:/app/storage/alerts:ro

volumes:
  pgdata:
  alert_storage:
