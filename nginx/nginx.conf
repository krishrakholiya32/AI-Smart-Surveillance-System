worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # Rate limiting — protects the API
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    upstream backend  { server backend:8000; }
    upstream frontend { server frontend:80;  }

    server {
        listen 80;
        server_name _;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Let's Encrypt HTTP-01 challenge. Needed for both initial cert
        # issuance and renewals — keep this reachable even after enabling
        # the redirect below.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Once you have a real certificate (see DEPLOY.md), uncomment this
        # to force all plain-HTTP traffic to HTTPS:
        # return 301 https://$host$request_uri;

        include /etc/nginx/common-locations.conf;
    }

    # HTTPS. Always enabled — scripts/init_certs.sh provisions a self-signed
    # bootstrap cert so this can start even before a real one exists; swap
    # it for a Let's Encrypt cert per DEPLOY.md once you have a domain.
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        include /etc/nginx/common-locations.conf;
    }
}
